<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0f14">
<title>Notes Pro</title>
<link rel="icon" id="fav" type="image/svg+xml" href="data:,">
<style>
:root{--bg:#0c0f14;--p:#131822;--p2:#1a2130;--tx:#f2f5fa;--mu:#8f9bad;--ac:#ffb84d;--ac2:#ffd77f;--acr:255,184,77;--on:#14110a;--dng:#ff5f7e;--bd:color-mix(in srgb,var(--tx) 10%,transparent);--pa:84%;--ma:62%;--a2r:255,215,127;--fa:.15;--fs:17px;--ew:860px;--ff:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--tx) 22%,transparent) transparent}
body{font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
::selection{background:rgba(var(--acr),.35)}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.noanim *,.noanim *::before,.noanim *::after{animation:none!important;transition:none!important}
.lite .brand h1{animation:none!important}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
@keyframes fade{from{opacity:0}}
@keyframes blink{50%{opacity:.3}}
@keyframes flick{0%,100%{text-shadow:0 0 14px rgba(255,122,26,.75)}45%{text-shadow:0 0 5px rgba(255,122,26,.4)}}
@keyframes shine{to{background-position:200% 0}}
@keyframes moon{50%{opacity:.5}}
@keyframes d1{to{transform:translate3d(24vmax,-8vmax,0) scale(1.15)}}
@keyframes d2{to{transform:translate3d(-22vmax,-6vmax,0) scale(1.1)}}
@keyframes d3{to{transform:translate3d(18vmax,10vmax,0) scale(1.2)}}
@keyframes gridmove{to{transform:perspective(380px) rotateX(64deg) translateY(64px)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes logoIn{from{opacity:0;transform:scale(.4) rotate(-20deg)}}
html[data-m=halloween] body{background:radial-gradient(ellipse at 85% 0,#2c1240,transparent 55%),radial-gradient(ellipse at 8% 100%,#3a1a08,transparent 50%),var(--bg)}
html[data-m=newyear] body{background:radial-gradient(ellipse at 50% -10%,#1d3270,transparent 60%),linear-gradient(#050c1e,#0a1a3e)}
html[data-m=halloween],html[data-m=newyear]{--pa:80%;--ma:45%}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#moon,.fog,#gd{position:fixed;pointer-events:none;z-index:0;opacity:0;will-change:transform,opacity}
#moon{right:7%;top:7%;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6d6,#ffd98a 55%,#e8a85a);box-shadow:0 0 80px 30px rgba(255,190,100,.28)}
html[data-m=halloween] #moon{opacity:.4;animation:moon 7s ease-in-out infinite}
.fog{width:80vmax;height:80vmax;border-radius:50%;opacity:1}
.f1{left:-20vmax;bottom:-38vmax;background:radial-gradient(circle,rgba(var(--acr),var(--fa)),transparent 65%);animation:d1 28s ease-in-out infinite alternate}
.f2{right:-24vmax;bottom:-42vmax;background:radial-gradient(circle,rgba(var(--a2r),calc(var(--fa)*.8)),transparent 65%);animation:d2 34s ease-in-out infinite alternate}
.f3{left:22vw;top:-52vmax;background:radial-gradient(circle,rgba(var(--a2r),calc(var(--fa)*.55)),transparent 65%);animation:d3 40s ease-in-out infinite alternate}
html[data-m=halloween]{--fa:.22}
html[data-m=halloween] .f1{background:radial-gradient(circle,rgba(130,70,210,.26),transparent 65%)}
html[data-m=halloween] .f2{background:radial-gradient(circle,rgba(255,110,20,.18),transparent 65%)}
html[data-t=aurora]{--fa:.34}html[data-t=cyber]{--fa:.22}
#gd{left:-50%;width:200%;bottom:-10vh;height:75vh;background-image:linear-gradient(rgba(var(--acr),.4) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--acr),.4) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:linear-gradient(transparent,#000 85%);mask-image:linear-gradient(transparent,#000 85%);transform:perspective(380px) rotateX(64deg);animation:gridmove 2.4s linear infinite}
html[data-t=cyber] #gd{opacity:.75}
html[data-t=cyber] .brand h1{text-shadow:0 0 14px rgba(var(--acr),.85)}
#gl{position:fixed;left:0;right:0;top:0;height:26px;z-index:40;pointer-events:none;display:none}
#gl::before{content:"";position:absolute;left:0;right:0;top:2px;height:2px;background:#1b2a18}
#gl i{position:absolute;width:10px;height:15px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;background:var(--c);box-shadow:0 0 12px 2px var(--c);animation:blink 1.6s ease-in-out infinite var(--d)}
html[data-m=newyear] #gl{display:block}
html[data-m=newyear] .app{margin-top:26px;height:calc(100dvh - 26px)}
.app{position:relative;z-index:1;display:grid;grid-template-columns:300px 1fr;height:100dvh}
.focus .app{grid-template-columns:1fr}.focus #sb,.focus .st{display:none}
#sb{display:flex;flex-direction:column;min-height:0;background:color-mix(in srgb,var(--p) var(--pa),transparent);border-right:1px solid var(--bd)}
.brand{display:flex;gap:11px;align-items:center;padding:16px 16px 12px}
.logo{width:44px;height:44px;position:relative;flex:0 0 auto;transition:transform .25s cubic-bezier(.3,1.6,.5,1);animation:logoIn .6s cubic-bezier(.3,1.5,.5,1) both}
.logo:hover{transform:rotate(-7deg) scale(1.08)}
.logo svg{display:block;width:44px;height:44px;filter:drop-shadow(0 8px 14px rgba(var(--acr),.32))}
.lgbig{display:block;width:96px;height:96px;margin:0 auto;filter:drop-shadow(0 14px 24px rgba(var(--acr),.35));animation:float 4s ease-in-out infinite}
html[data-m] .logo::after{position:absolute;right:-7px;top:-8px;font-size:15px;line-height:1}
html[data-m=halloween] .logo::after{content:"🎃"}html[data-m=newyear] .logo::after{content:"🎅"}
.brand h1{font-size:18px;letter-spacing:-.03em;line-height:1.1}.brand p{font-size:11.5px;color:var(--mu);margin-top:3px}
html[data-m=halloween] .brand h1{animation:flick 3.5s infinite;color:var(--ac2)}
html[data-m=newyear] .brand h1{background:linear-gradient(90deg,#ffd166,#ff5d73,#5ab8ff,#ffd166);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
.sbt{padding:0 12px 8px}
.srch{position:relative;display:block}.srch span{position:absolute;left:12px;top:11px;color:var(--mu)}
#q{width:100%;height:40px;padding:0 12px 0 38px;border-radius:12px;border:1px solid var(--bd);background:var(--p2);outline:0;transition:border-color .2s,box-shadow .2s}
#q:focus{border-color:rgba(var(--acr),.6);box-shadow:0 0 0 4px rgba(var(--acr),.1)}
.cta{width:100%;height:42px;margin-top:8px;border-radius:12px;background:var(--ac);color:var(--on);font-weight:750;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,filter .15s}
.cta:hover{filter:brightness(1.07);transform:translateY(-1px)}.cta:active{transform:scale(.98)}
.tabs{display:flex;gap:4px;margin-top:10px;padding:3px;background:var(--p2);border-radius:11px}
.tabs button{flex:1;height:32px;border-radius:8px;color:var(--mu);font-size:13px;font-weight:600;transition:background .15s,color .15s}
.tabs button.on{background:var(--p);color:var(--tx);box-shadow:0 1px 6px rgba(0,0,0,.18)}.tabs b{font-weight:600;opacity:.6;margin-left:3px}
#list{flex:1;min-height:0;overflow-y:auto;padding:4px 8px 10px;overscroll-behavior:contain}
.it{display:flex;gap:6px;align-items:center;padding:9px 10px;margin:2px 0;border-radius:12px;cursor:pointer;transition:background .12s,opacity .17s,transform .17s;content-visibility:auto;contain-intrinsic-size:auto 58px}
.it.new{animation:in .22s both}
.it:hover{background:var(--p2)}.it.on{background:rgba(var(--acr),.13);box-shadow:inset 0 0 0 1px rgba(var(--acr),.25)}
.it.out{opacity:0;transform:translateX(-26px)}
.im{flex:1;min-width:0}.it-t{font-weight:650;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-p{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it-d{font-size:10.5px;color:var(--mu);opacity:.8;margin-top:2px}
.pn{color:var(--ac2);font-style:normal;margin-right:4px}
.ia{display:flex;opacity:0;transition:opacity .12s}.it:hover .ia,.it:focus-within .ia{opacity:1}
@media(hover:none){.ia{opacity:.85}}
.ia button,.ib{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--mu);transition:background .12s,color .12s}
.ia button:hover,.ib:hover{background:var(--p2);color:var(--tx)}.ia .rd:hover,#db:hover{color:var(--dng);background:rgba(255,95,126,.14)}
.ib.on,.ia button.on{color:var(--ac2)}.ib.on svg,.ia button.on svg{fill:currentColor}
.empty{padding:34px 14px;text-align:center;color:var(--mu);font-size:13px}.empty b{display:block;font-size:26px;margin-bottom:6px}
.purge{width:100%;margin-top:8px;height:38px;border-radius:10px;color:var(--dng);border:1px dashed rgba(255,95,126,.4)}
.sbf{padding:8px;border-top:1px solid var(--bd)}.sbf button{width:100%;height:40px;border-radius:10px;display:flex;align-items:center;gap:10px;padding:0 10px;color:var(--mu)}.sbf button:hover{background:var(--p2);color:var(--tx)}
main{display:flex;flex-direction:column;min-width:0;min-height:0;background:color-mix(in srgb,var(--bg) var(--ma),transparent)}
.top{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--bd)}
#ti{flex:1;min-width:0;height:40px;background:none;border:0;outline:0;font-size:21px;font-weight:800;letter-spacing:-.03em}
#ti::placeholder,#ed:empty::before{color:var(--mu);opacity:.55}
#ss{font-size:11.5px;color:var(--mu);white-space:nowrap;min-width:78px;text-align:right}#ss.ok{color:#4bd7a4}#ss.busy{color:var(--ac2)}#ss.err{color:var(--dng)}
.acts{display:flex;gap:2px}.mob{display:none}
.tb{display:flex;gap:2px;padding:6px 16px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--bd)}
.tb button{flex:0 0 auto;min-width:34px;height:34px;padding:0 8px;border-radius:9px;color:var(--mu);font-size:14px;transition:background .12s,color .12s}
.tb button:hover{background:var(--p2);color:var(--tx)}.tb button.on{background:rgba(var(--acr),.16);color:var(--ac2)}.tb hr{border:0;width:1px;background:var(--bd);margin:6px 4px;flex:0 0 1px}
.sc{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
#ed{max-width:var(--ew);margin:0 auto;padding:28px 22px 40vh;min-height:100%;outline:0;font:var(--fs)/1.75 var(--ff);overflow-wrap:anywhere;caret-color:var(--ac)}
#ed:empty::before{content:attr(data-ph)}
#ed h1{font-size:1.9em;line-height:1.2;margin:1em 0 .4em;letter-spacing:-.03em}#ed h2{font-size:1.5em;line-height:1.25;margin:1em 0 .4em}#ed h3{font-size:1.2em;margin:1em 0 .4em}#ed p{margin:.45em 0}
#ed blockquote{margin:1em 0;padding:10px 18px;border-left:4px solid var(--ac);background:rgba(var(--acr),.08);border-radius:0 12px 12px 0}
#ed pre{margin:1em 0;padding:14px;border-radius:12px;background:var(--p2);border:1px solid var(--bd);font:.85em/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}
#ed ul,#ed ol{padding-left:26px;margin:.5em 0}#ed a{color:var(--ac2);text-underline-offset:3px}#ed img{max-width:100%;border-radius:12px}#ed hr{border:0;height:1px;background:var(--bd);margin:1.4em 0}
.task{display:flex;gap:10px;align-items:flex-start;margin:.2em 0}.task input{width:18px;height:18px;margin-top:.45em;accent-color:var(--ac);flex:0 0 auto;cursor:pointer}.task span{flex:1;min-width:0;transition:opacity .2s}.task input:checked+span{text-decoration:line-through;opacity:.5}
.es{flex:1;display:grid;place-content:center;text-align:center;gap:14px;color:var(--mu)}.es b{font-size:44px}.es .cta{width:auto;padding:0 22px;margin:0 auto}
.st{display:flex;justify-content:space-between;padding:6px 18px;font-size:11px;color:var(--mu);border-top:1px solid var(--bd)}
.toast{position:fixed;left:50%;bottom:26px;z-index:90;transform:translate(-50%,20px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:14px;padding:10px 12px 10px 16px;border-radius:14px;background:var(--p2);border:1px solid var(--bd);box-shadow:0 16px 50px rgba(0,0,0,.4);font-size:13.5px;transition:opacity .2s,transform .2s;max-width:calc(100vw - 24px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}.toast button{color:var(--ac2);font-weight:750;padding:4px 8px;border-radius:8px}.toast button:hover{background:rgba(var(--acr),.15)}
#md{position:fixed;inset:0;z-index:80;display:none;place-items:center;padding:12px;background:rgba(0,0,0,.55)}#md.on{display:grid}
.mc{width:min(780px,100%);height:min(560px,calc(100dvh - 24px));display:flex;flex-direction:column;background:var(--p);border:1px solid var(--bd);border-radius:20px;padding:16px 18px;animation:pop .2s}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.mh h2{font-size:19px}
.mbody{flex:1;min-height:0;display:flex;gap:18px}
.mn{display:flex;flex-direction:column;gap:4px;width:150px;flex:0 0 auto}.mn button{height:40px;border-radius:11px;text-align:left;padding:0 12px;color:var(--mu);font-weight:600;transition:background .12s,color .12s}
.mn button:hover{background:var(--p2);color:var(--tx)}.mn button.on{background:rgba(var(--acr),.15);color:var(--tx)}
.mp{flex:1;min-width:0;overflow-y:auto;padding-right:4px;animation:fade .18s}
.mp h3{font-size:13px;color:var(--mu);margin:2px 0 10px;font-weight:650}.mp h3:not(:first-child){margin-top:20px}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.tc{text-align:left;padding:8px;border-radius:14px;border:1px solid var(--bd);background:var(--p2);transition:transform .15s}
.tc:hover{transform:translateY(-2px)}.tc.on{box-shadow:inset 0 0 0 2px var(--ac)}.tc b{display:block;font-size:12.5px;margin-top:6px}
.sw{height:50px;border-radius:9px;display:grid;place-items:center;font-size:22px}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px;border:1px solid var(--bd);border-radius:14px;background:var(--p2);margin-bottom:10px}.row small{display:block;color:var(--mu);font-size:12px;margin-top:2px;max-width:340px}
.seg{display:flex;padding:3px;background:var(--p);border:1px solid var(--bd);border-radius:11px;flex:0 0 auto}.seg button{height:30px;padding:0 11px;border-radius:8px;color:var(--mu);font-size:13px;font-weight:600;transition:background .12s,color .12s}.seg button.on{background:var(--ac);color:var(--on)}
.sw2{width:46px;height:26px;border-radius:99px;background:var(--p);border:1px solid var(--bd);position:relative;flex:0 0 auto;transition:background .2s}.sw2::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--mu);transition:transform .2s,background .2s}
.sw2.on{background:var(--ac)}.sw2.on::after{transform:translateX(20px);background:var(--on)}
.pv{padding:14px 16px;border-radius:14px;border:1px solid var(--bd);background:var(--p2);font:var(--fs)/1.7 var(--ff);overflow-wrap:anywhere}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns button{height:38px;padding:0 14px;border-radius:10px;background:var(--p2);border:1px solid var(--bd);transition:border-color .15s}.btns button:hover{border-color:rgba(var(--acr),.5)}
.hint{font-size:12px;color:var(--mu);margin-top:12px}
.kt{width:100%;border-collapse:collapse}.kt td{padding:9px 2px;border-bottom:1px solid var(--bd);font-size:13px}.kt td:last-child{text-align:right;color:var(--mu)}
#ov{display:none}
@media(max-width:800px){
.app{grid-template-columns:1fr}.mob{display:grid}
#sb{position:fixed;left:0;top:0;bottom:0;width:min(330px,88vw);z-index:30;transform:translateX(-102%);transition:transform .25s;background:var(--p)}
html[data-m=newyear] #sb{top:26px}
.sbo #sb{transform:none}.sbo #ov{display:block;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5)}
#ss{display:none}#ti{font-size:18px}#ed{padding:20px 16px 40vh}.tb{padding:6px 10px}.top{padding:8px 10px}.st{padding:5px 12px}
.mbody{flex-direction:column;gap:10px}.mn{flex-direction:row;width:auto;overflow-x:auto}.mn button{flex:0 0 auto}.mc{height:calc(100dvh - 24px)}
}
.top{position:relative}.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--acr),.6),transparent)}
.tp{position:fixed;z-index:70;padding:10px;border-radius:16px;background:var(--p);border:1px solid var(--bd);box-shadow:0 18px 50px rgba(0,0,0,.45);display:grid;grid-template-columns:repeat(4,44px);gap:8px;animation:pop .16s}
.td{width:44px;height:44px;border-radius:50%;border:2px solid transparent;transition:transform .15s}.td:hover{transform:scale(1.12)}.td.on{border-color:var(--tx)}
</style>
</head>
<body>
<div id="moon"></div><div id="gd"></div><div class="fog f1"></div><div class="fog f2"></div><div class="fog f3"></div><canvas id="fx"></canvas><div id="gl"></div>
<div class="app">
<aside id="sb">
 <div class="brand"><div class="logo" id="logo"><svg viewBox="0 0 64 64"><use href="#lg"/></svg></div><div><h1>Notes Pro</h1><p id="sub"></p></div></div>
 <div class="sbt">
  <label class="srch"><span id="isr"></span><input id="q" placeholder="Поиск (Ctrl K)" autocomplete="off"></label>
  <button class="cta" id="nb"><span id="inew"></span>Новая заметка</button>
  <div class="tabs"><button class="on" data-v="n">Заметки<b id="cn"></b></button><button data-v="t">Корзина<b id="ct"></b></button></div>
 </div>
 <div id="list"><div id="items"></div><div id="listx"></div></div>
 <div class="sbf"><button id="stb"><span id="iset"></span>Настройки и темы</button></div>
</aside>
<div id="ov"></div>
<main>
 <header class="top">
  <button class="ib mob" id="mb" title="Меню"></button>
  <input id="ti" placeholder="Название заметки" autocomplete="off">
  <span id="ss"></span>
  <div class="acts"><button class="ib mob" id="nb3" title="Новая заметка"></button><button class="ib" id="thb" title="Тема (Alt+T — следующая)"></button><button class="ib" id="pb" title="Закрепить"></button><button class="ib" id="fb" title="Режим фокуса (Ctrl+Shift+F)"></button><button class="ib" id="db" title="В корзину"></button></div>
 </header>
 <div class="tb" id="tb">
  <button data-c="bold" title="Жирный"><b>B</b></button><button data-c="italic" title="Курсив"><i>I</i></button><button data-c="underline" title="Подчёркнутый"><u>U</u></button><button data-c="strikeThrough" title="Зачёркнутый"><s>S</s></button><hr>
  <button data-b="h1">H1</button><button data-b="h2">H2</button><button data-b="h3">H3</button><hr>
  <button data-c="insertUnorderedList" title="Список">•</button><button data-c="insertOrderedList" title="Нумерация">1.</button><button data-x="task" title="Чек-лист">☑</button><hr>
  <button data-b="blockquote" title="Цитата">❝</button><button data-b="pre" title="Код">&lt;/&gt;</button><button data-c="insertHorizontalRule" title="Разделитель">―</button><button data-x="link" title="Ссылка">🔗</button><button data-c="removeFormat" title="Очистить форматирование">Tx</button>
 </div>
 <div class="es" id="es" hidden><svg class="lgbig" viewBox="0 0 64 64"><use href="#lg"/></svg><div>Здесь пока пусто</div><button class="cta" id="nb2">Создать заметку</button></div>
 <div class="sc" id="sc"><div id="ed" contenteditable="true" spellcheck="true" data-ph="Начните писать…"></div></div>
 <footer class="st"><span id="wc"></span><span id="up"></span></footer>
</main>
</div>
<div class="toast" id="ts"></div>
<div class="tp" id="tp" hidden></div>
<div id="md"></div>

<script>
